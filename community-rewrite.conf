# 社区抓包 Rewrite（引用原作者）
# 用完务必关闭对应行。不含解锁 VIP / 去广告破解。
# 与 rewrite.conf 分开订阅，避免和自用签到的 hostname 搅在一起。

hostname = passport.iqiyi.com, www.52pojie.cn, app.bilibili.com, api.kkmh.com, zhiyou.smzdm.com, www.v2ex.com, act.10010.com, m.client.10010.com, music.163.com

# 爱奇艺：Safari 打开 https://m.iqiyi.com/user.html 登录
^https:\/\/passport\.iqiyi\.com\/apis\/user\/ url script-request-header https://raw.githubusercontent.com/NobyDa/Script/master/iQIYI-DailyBonus/iQIYI.js

# 吾爱破解：登录 www.52pojie.cn 后打开个人主页
https:\/\/www\.52pojie\.cn\/home\.php\? url script-request-header https://raw.githubusercontent.com/NobyDa/Script/master/52pojie-DailyBonus/52pojie.js

# 哔哩哔哩漫画
^https:\/\/app\.bilibili\.com\/x\/v2\/account\/myinfo url script-request-header https://raw.githubusercontent.com/NobyDa/Script/master/Bilibili-DailyBonus/Manga.js

# 快看漫画
^https:\/\/api\.kkmh\.com\/v\d\/passport\/user url script-request-header https://raw.githubusercontent.com/NobyDa/Script/master/KuaiKan-DailyBonus/KKMH.js

# 什么值得买（chavy 的 cookie 脚本偏 Surge 变量名，QX 建议用 BoxJs 填 CK）
^https:\/\/zhiyou\.smzdm\.com\/ url script-request-header https://raw.githubusercontent.com/chavyleung/scripts/master/smzdm/smzdm.cookie.js

# V2EX
^https:\/\/www\.v2ex\.com\/mission\/daily url script-request-header https://raw.githubusercontent.com/chavyleung/scripts/master/v2ex/v2ex.cookie.js
